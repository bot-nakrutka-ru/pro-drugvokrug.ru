
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f1117;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 450px;
        }

        .icon {
            font-size: 65px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #a0a4b0;
            font-size: 16px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            border-radius: 30px;
            background: #252a35;
            color: #f5bd4f;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 25px;
            }

            p {
                font-size: 14px;
            }

            .icon {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon">🛠️</div>

        <h1>Технические работы</h1>

        <p>
            В данный момент на сайте проводятся технические работы.
            Мы уже работаем над улучшениями и скоро вернёмся!
        </p>

        <div class="status">
            ● Сайт временно недоступен
        </div>
    </div>

</body>
</html>
